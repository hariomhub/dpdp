name: Deploy — Super Admin

# Triggers on push to main when any relevant file changes,
# or manually via GitHub Actions UI (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - 'apps/admin-api/**'
      - 'apps/super-admin/**'
      - 'packages/database/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - '.github/workflows/deploy-super-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node ────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install all workspace dependencies ──────────────────────────────
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ── 4. Generate Prisma clients ─────────────────────────────────────────
      # Both clients must be generated (super-admin + tenant) because
      # packages/database generates them together in a single command.
      - name: Generate Prisma clients
        env:
          SUPER_ADMIN_DATABASE_URL: ${{ secrets.SUPER_ADMIN_DATABASE_URL }}
          TENANT_DATABASE_URL: ${{ secrets.TENANT_DATABASE_URL }}
        run: npm run generate --workspace=packages/database

      # ── 5. Run DB migrations ───────────────────────────────────────────────
      # Uses `prisma migrate deploy` which only runs new migrations (safe
      # to run on every deploy — idempotent for already-applied migrations).
      - name: Run super-admin DB migrations
        env:
          SUPER_ADMIN_DATABASE_URL: ${{ secrets.SUPER_ADMIN_DATABASE_URL }}
        run: npm run migrate:super-admin:prod --workspace=packages/database

      # ── 6. Build super-admin frontend (Vite) ──────────────────────────────
      # VITE_API_URL is set to /api/v1 (relative path) so the app works
      # on any hostname — no hardcoded Azure URL needed.
      - name: Build super-admin frontend
        env:
          VITE_API_URL: /api/v1
        run: npx turbo build --filter=@dpdp/super-admin

      # ── 7. Build admin-api + copy frontend into public/ ───────────────────
      # build:prod does two things:
      #   a) esbuild bundles src/app.ts + all workspace deps (including
      #      @dpdp/database) into a single dist/app.js. Only @prisma/*
      #      and pg are kept as external runtime deps.
      #   b) Copies apps/super-admin/dist/ → apps/admin-api/public/
      #      so Express can serve the React app as static files.
      - name: Build admin-api (bundle + embed frontend)
        run: npm run build:prod --workspace=@dpdp/admin-api

      # ── 8. Assemble deployment package ────────────────────────────────────
      # We ship only what Node needs at runtime:
      #   dist/     – the esbuild bundle (single file)
      #   public/   – the super-admin React build
      #   node_modules/@prisma/ – generated client + adapter + runtime
      #   node_modules/pg*/     – PostgreSQL driver + transitive deps
      - name: Assemble deployment package
        run: |
          mkdir -p deploy

          # Backend bundle (single file from esbuild)
          cp -r apps/admin-api/dist   deploy/dist

          # Frontend static files (Express serves these)
          cp -r apps/admin-api/public deploy/public

          # Minimal package.json — Azure uses this for startup detection
          cat > deploy/package.json << 'PKGJSON'
          {
            "name": "dpdp-admin-api",
            "version": "1.0.0",
            "scripts": { "start": "node dist/app.js" },
            "engines": { "node": ">=20" }
          }
          PKGJSON

          # Copy the full @prisma directory from the monorepo root node_modules.
          # This includes:
          #   @prisma/super-admin-client  (generated — not on npm registry)
          #   @prisma/adapter-pg          (pg driver adapter)
          #   @prisma/client              (Prisma runtime)
          mkdir -p deploy/node_modules
          cp -r node_modules/@prisma deploy/node_modules/@prisma

          # Install pg (+ all transitive deps) into the deploy folder.
          # --no-workspaces prevents npm from finding the monorepo root workspaces config.
          cd deploy && npm install --save pg@"^8.20.0" --no-workspaces --no-package-lock --quiet
          cd ..

          # Create the ZIP for Azure App Service ZIP deploy
          cd deploy && zip -r ../release.zip . && cd ..
          echo "Package size: $(du -sh release.zip | cut -f1)"

      # ── 9. Deploy to Azure App Service ────────────────────────────────────
      # Requires two GitHub Secrets (see README / docs for setup):
      #   AZURE_WEBAPP_NAME          – your App Service name (e.g. dpdp-admin-staging)
      #   AZURE_WEBAPP_PUBLISH_PROFILE – XML publish profile from Azure Portal
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip

      # ── 10. Smoke test ─────────────────────────────────────────────────────
      # Wait for the App Service to restart, then hit the health endpoint.
      # Fails the workflow if the API doesn't respond — catches broken deploys.
      - name: Smoke test — health check
        run: |
          echo "Waiting 30s for App Service to restart..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health")
          echo "Health check HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Deployment healthy"
