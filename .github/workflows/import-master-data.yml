name: Import — Super Admin Master Data

# Trigger manually from GitHub Actions UI
on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install import dependencies
        run: npm install exceljs pg --ignore-scripts

      - name: Diagnostics
        run: |
          echo "Node version: $(node -v)"
          echo "Excel file exists: $(test -f super-admin-master-data.xlsx && echo YES || echo NO)"
          echo "Import script exists: $(test -f import-master-data.js && echo YES || echo NO)"
          echo "exceljs installed: $(node -e "require('exceljs'); console.log('YES')" 2>&1)"
          echo "pg installed: $(node -e "require('pg'); console.log('YES')" 2>&1)"

      - name: Run master data import
        env:
          AZURE_SUPER_ADMIN_DATABASE_URL: ${{ secrets.SUPER_ADMIN_DATABASE_URL }}
        run: node import-master-data.js --db=azure
